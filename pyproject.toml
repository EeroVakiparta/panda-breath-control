[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "panda-breath-control"
dynamic = ["version"]
description = "Unofficial desktop control window for the BIQU Panda Breath chamber heater"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eero Vakiparta" }]
requires-python = ">=3.9"
dependencies = ["websockets>=12"]
keywords = ["3d-printing", "panda-breath", "biqu", "chamber-heater", "tkinter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Topic :: Home Automation",
]

[project.urls]
Homepage = "https://github.com/EeroVakiparta/panda-breath-control"
Issues = "https://github.com/EeroVakiparta/panda-breath-control/issues"

[project.gui-scripts]
panda-breath-control = "panda_breath_control.ui:main"

[project.scripts]
panda-breath = "panda_breath_control.cli:main"

[tool.setuptools.packages.find]
include = ["panda_breath_control", "panda_breath_control.*"]

[tool.setuptools.dynamic]
version = { attr = "panda_breath_control.__version__" }

[tool.setuptools.package-data]
panda_breath_control = ["assets/*"]
