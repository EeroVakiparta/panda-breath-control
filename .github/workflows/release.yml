name: release

# Push a tag like v0.2.0 to publish a GitHub release with a Windows .exe and
# Python packages. The tag must match __version__ in panda_breath_control and
# CHANGELOG.md must have a "## 0.2.0" section; its text becomes the release
# notes. "Run workflow" on the Actions tab builds everything without
# publishing, to check a build before tagging.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: version
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('panda_breath_control/__init__.py').read()).group(1))")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
          grep -q "^## $version " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t . -v

  windows-exe:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pyinstaller
      - name: Build PandaBreathControl.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name PandaBreathControl
          --icon panda_breath_control/assets/icon.ico
          --add-data "panda_breath_control/assets;panda_breath_control/assets"
          --collect-submodules websockets
          panda-breath-control.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/PandaBreathControl.exe

  python-package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  publish:
    if: github.ref_type == 'tag'
    needs: [check, windows-exe, python-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${{ needs.check.outputs.version }}" '
            $0 ~ "^## " v " " {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ### Downloads

          - `PandaBreathControl.exe`: Windows, no Python needed. It is not code-signed, so
            Windows SmartScreen may say "Windows protected your PC"; choose More info,
            then Run anyway.
          - `.whl` / `.tar.gz`: for `pip install`, on any system with Python 3.9+.

          Read the [disclaimer](https://github.com/${{ github.repository }}/blob/main/DISCLAIMER.md) before use.
          EOF
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*
          --title "Panda Breath Control ${{ needs.check.outputs.version }}"
          --notes-file notes.md
